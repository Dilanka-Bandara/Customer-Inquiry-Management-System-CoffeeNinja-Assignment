# Local PostgreSQL for development and tests.
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data)
services:
  db:
    image: postgres:17-alpine
    container_name: inquiry-db
    restart: unless-stopped # comes back automatically after Docker/PC restarts
    environment:
      POSTGRES_USER: inquiry
      POSTGRES_PASSWORD: inquiry
      POSTGRES_DB: inquiry_dev
    ports:
      # Host port 5434 -> container 5432 (5432/5433 are often already used locally)
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the separate test database on first start
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquiry -d inquiry_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
